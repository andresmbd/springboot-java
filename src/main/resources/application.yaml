spring:
  application:
    name: catalogo-productos
  datasource:
    url: jdbc:h2:mem:catalogobd
    username : sa
    password :
    driver-class-name : org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create
  h2:
    console:
      enabled: true

security:
  jwt:
    secret: demo-secret-key-change-this-in-production-123456789
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

logging:
  level:
    org.springframework.security: DEBUG